<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    background: #ece7dc;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #1c201e;
    display: flex; align-items: center;
    padding: 0 0 0 96px;
    gap: 72px;
  }
  .copy { width: 430px; flex: none; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .brand svg { width: 44px; height: 44px; }
  .brand span { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  h1 { font-size: 44px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 22px; }
  p { font-size: 19px; line-height: 1.5; color: #4d524e; margin-bottom: 28px; }
  ul { list-style: none; }
  li { font-size: 17px; line-height: 1.45; padding: 9px 0 9px 26px; position: relative; border-top: 1px solid #d6d0c3; }
  li:last-child { border-bottom: 1px solid #d6d0c3; }
  li::before { content: ""; position: absolute; left: 2px; top: 17px; width: 9px; height: 9px; border-radius: 2px; background: #f2a33a; }

  .window {
    position: relative;
    width: 720px; height: 680px;
    background: #fff;
    border-radius: 12px 0 0 12px;
    box-shadow: 0 30px 70px rgba(40, 35, 20, .18), 0 2px 6px rgba(40, 35, 20, .08);
    overflow: hidden;
    flex: none;
  }
  .bar { height: 48px; background: #f1efea; border-bottom: 1px solid #e0dcd2; display: flex; align-items: center; padding: 0 14px; gap: 10px; }
  .url { flex: 1; height: 30px; border-radius: 15px; background: #fff; border: 1px solid #e0dcd2; font-size: 13px; color: #6a6f6b; display: flex; align-items: center; padding: 0 14px; }
  .ext { width: 30px; height: 30px; border-radius: 6px; background: #e3ded3; display: flex; align-items: center; justify-content: center; position: relative; }
  .ext svg { width: 18px; height: 18px; }
  .badge { position: absolute; right: -3px; bottom: -2px; background: #1f6b4a; color: #fff; font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 6px; line-height: 13px; }
  .page { padding: 34px 40px; }
  .line { height: 12px; border-radius: 6px; background: #eeebe5; margin-bottom: 14px; }
  .popup {
    position: absolute; top: 52px; left: 300px;
    width: 340px; border: 0;
    border-radius: 8px;
    box-shadow: 0 12px 36px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06);
    transform-origin: top left;
    background: #f6f4ef;
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="#1f4a38"/><path d="M5.5 13.5V2.8" stroke="#f4ecdc" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M5.5 10.5C5.5 7.6 10.5 8.4 10.5 5V2.8" stroke="#f2a33a" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>Byroad</span>
    </div>
    <h1 id="title"></h1>
    <p id="lead"></p>
    <ul id="points"></ul>
  </div>

  <div class="window">
    <div class="bar">
      <div class="url" id="url"></div>
      <div class="ext">
        <svg viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="#1f4a38"/><path d="M5.5 13.5V2.8" stroke="#f4ecdc" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M5.5 10.5C5.5 7.6 10.5 8.4 10.5 5V2.8" stroke="#f2a33a" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        <span class="badge" id="badge"></span>
      </div>
    </div>
    <div class="page">
      <div class="line" style="width:60%"></div><div class="line" style="width:85%"></div><div class="line" style="width:72%"></div>
      <div class="line" style="width:40%;margin-top:30px"></div><div class="line" style="width:90%"></div><div class="line" style="width:66%"></div>
    </div>
    <iframe class="popup" id="popup"></iframe>
  </div>

<script>
  var shot = new URLSearchParams(location.search).get('shot') || 'sites';
  var content = {
    sites: {
      title: 'Proxy the sites you choose. Leave the rest alone.',
      lead: 'Pick services or sites, and only their traffic goes through your SOCKS5 or HTTP proxy.',
      points: ['One-click presets for popular services', 'Tick any open tab to route it', 'Subdomains are covered automatically'],
      url: 'reddit.com/r/selfhosted', badge: '15', height: 600, scale: 1.05,
    },
    global: {
      title: 'Or send everything through, with exceptions.',
      lead: 'Switch to Everything mode and keep a short list of sites that always connect directly.',
      points: ['Works with SOCKS5, SOCKS4, HTTP and HTTPS proxies', 'Tells you when the proxy can\'t be reached', 'No accounts, no tracking, nothing leaves your browser'],
      url: 'news.ycombinator.com', badge: 'all', height: 330, scale: 1.2,
    },
  }[shot];

  document.getElementById('title').textContent = content.title;
  document.getElementById('lead').textContent = content.lead;
  document.getElementById('url').textContent = content.url;
  document.getElementById('badge').textContent = content.badge;
  content.points.forEach(function (t) {
    var li = document.createElement('li'); li.textContent = t;
    document.getElementById('points').append(li);
  });
  var f = document.getElementById('popup');
  f.style.height = content.height + 'px';
  f.style.transform = 'scale(' + content.scale + ')';
  f.style.left = (682 - 340 * content.scale - 24) + 'px';  // window bleeds 38px off the right edge
  f.src = '.popup-preview.html?shot=' + shot;
</script>
</body>
</html>
