name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest
        run: node -e "const m = JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8')); console.log(m.name, m.version)"

      - name: Syntax-check scripts
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

      - name: Check that every file the manifest references exists
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            const files = [m.background.service_worker, m.action.default_popup,
              ...Object.values(m.icons), ...Object.values(m.action.default_icon)];
            const missing = files.filter((f) => !fs.existsSync('extension/' + f));
            if (missing.length) { console.error('Missing:', missing); process.exit(1); }
          "
